<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>NOVARA Pricing Pro</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
header{background:#000;padding:20px;text-align:center;border-bottom:3px solid #C8A96A}
header img{height:90px}
header h1{color:#C8A96A;margin:10px 0 0}
.container{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#1b1b1b;border:1px solid #6E7352;border-radius:14px;padding:20px;box-shadow:0 0 20px rgba(200,169,106,.15)}
label{display:block;margin-top:12px;color:#C8A96A;font-weight:bold}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #6E7352;background:#fff;color:#111}
button{width:100%;margin-top:20px;padding:14px;background:#6E7352;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold}
button:hover{background:#C8A96A;color:#111}
table{width:100%;border-collapse:collapse}
td{padding:12px;border-bottom:1px solid #444}
.result{font-size:30px;color:#C8A96A;font-weight:bold}
.green{color:#9EB06C;font-weight:bold}
@media(max-width:768px){.container{grid-template-columns:1fr} header img{height:70px}}
</style><link href="manifest.json" rel="manifest"/><meta content="#000000" name="theme-color"/>
<style>
:root{--bg:#f5f7fb;--card:#fff;--primary:#111827;--accent:#c8a96a}
body{background:var(--bg)!important;color:#222!important;font-family:Inter,Arial,sans-serif!important}
header{background:linear-gradient(135deg,#111827,#1f2937)!important;border-bottom:none!important;box-shadow:0 8px 20px rgba(0,0,0,.18)}
header h1{color:#fff!important;font-size:2rem}
.container{max-width:1200px!important;gap:24px!important}
.container>*,.card,form,section{background:var(--card)!important;color:#222!important;border-radius:18px!important;box-shadow:0 10px 30px rgba(0,0,0,.08)!important;padding:18px!important}
button{border:none!important;border-radius:14px!important;padding:14px 18px!important;font-weight:700!important;cursor:pointer}
input,select{border-radius:12px!important;padding:12px!important;border:1px solid #d1d5db!important;background:#fff!important;color:#111!important}
</style>
</head>

<h1>NOVARA Pricing Pro</h1>
<div>Sistema Inteligente de Fijación de Precios</div>
</header>
<div class="container">
<div class="card" id="configCard">
<h2>⚙ Configuración</h2>
<label>Envío Chico</label><input id="envChico" type="number" value="4000"/>
<label>Envío Mediano</label><input id="envMediano" type="number" value="7000"/>
<label>Envío Grande</label><input id="envGrande" type="number" value="11000"/>
<label>Devolución Chica</label><input id="devChica" type="number" value="800"/>
<label>Devolución Mediana</label><input id="devMediana" type="number" value="1400"/>
<label>Devolución Grande</label><input id="devGrande" type="number" value="2200"/>
<button onclick="guardarConfig()">Guardar configuración</button>
</div>
<div class="card">
<label>Costo del proveedor</label><input id="costo" type="number" value="59900"/>
<label>Tipo de producto</label>
<select id="tipo"><option value="1">Chico</option><option selected="" value="2">Mediano</option><option value="3">Grande</option></select>
<label>Publicidad (%)</label><input id="publi" type="number" value="15"/>
<label>Mercado Pago 3 cuotas (%)</label><input id="mp" type="number" value="12.19"/>
<label>Margen deseado (%)</label><input id="margen" type="number" value="28"/>
<button onclick="calc()">Calcular precio</button>
</div>
<div class="card"><table>
<tr><td>Envío estimado</td><td id="envio"></td></tr>
<tr><td>Fondo devoluciones</td><td id="dev"></td></tr>
<tr><td>Costo total</td><td id="ct"></td></tr>
<tr><td>Precio publicado</td><td class="result" id="precio"></td></tr>
<tr><td>Precio transferencia</td><td class="green" id="trans"></td></tr>
<tr><td>Ganancia estimada</td><td id="gan"></td></tr>
<tr><td>Rentabilidad</td><td id="estado"></td></tr>
</table></div></div>
<script>
function money(x){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(x)}
function calc(){
let costo=+costoEl.value,tipo=tipoEl.value;
let envio=tipo==1?+envChico.value:tipo==2?+envMediano.value:+envGrande.value;
let dev=tipo==1?+devChica.value:tipo==2?+devMediana.value:+devGrande.value;
let publi=+publiEl.value/100,mp=+mpEl.value/100,margen=+margenEl.value/100;
let costoTotal=(costo+envio+dev)*(1+publi);
let precio=costoTotal/(1-mp-margen);
let trans=precio*0.90;
let gan=precio-costoTotal-(precio*mp);
envioOut.innerText=money(envio);devOut.innerText=money(dev);ctOut.innerText=money(costoTotal);
precioOut.innerText=money(Math.ceil(precio/100)*100);
transOut.innerText=money(Math.ceil(trans/100)*100);
ganOut.innerText=money(gan);
let rent=gan/precio;
estadoOut.innerHTML=rent>.30?'🟢 Excelente':rent>.20?'🟡 Buena':'🔴 Baja';
}
const costoEl=costo,publiEl=publi,mpEl=mp,margenEl=margen,tipoEl=tipo;
const envioOut=envio,devOut=dev,ctOut=ct,precioOut=precio,transOut=trans,ganOut=gan,estadoOut=estado;
calc();

function guardarConfig(){
['envChico','envMediano','envGrande','devChica','devMediana','devGrande'].forEach(id=>localStorage.setItem(id,document.getElementById(id).value));
alert('Configuración guardada');
}
window.addEventListener('load',()=>{
['envChico','envMediano','envGrande','devChica','devMediana','devGrande'].forEach(id=>{
let v=localStorage.getItem(id); if(v) document.getElementById(id).value=v;
});
});

</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));}</script></body></html>
